name: Hermès to Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python hermes_watch.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_HERMES }}
          KEYWORDS: ${{ vars.HERMES_KEYWORDS }}
          NOTIFY_REMOVED: ${{ vars.HERMES_NOTIFY_REMOVED }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add hermes_state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update Hermès state"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_HERMES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ Hermès watcher run failed. Details: $RUN_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
