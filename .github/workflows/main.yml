name: OzBargain to Discord

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it later than this)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: ozb-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python ozb_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KEYWORDS: ${{ vars.KEYWORDS }}

      - name: Save seen deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen deals"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ OzBWatchdog run failed. Details: $RUN_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
