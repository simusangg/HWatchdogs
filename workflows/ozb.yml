name: OzBargain to Discord

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it later than this)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: ozb-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python ozb_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KEYWORDS: ${{ vars.KEYWORDS }}

      - name: Save seen deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen deals" && git push)
